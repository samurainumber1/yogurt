<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; font-src 'self' data:; media-src 'self' data: blob:; object-src 'none'; frame-src 'none'; manifest-src 'none'; base-uri 'self'; form-action 'none';">
    <link rel="icon" href="data:,">
    <title>Space Waves</title>
    <style>
        html, body, #unity-container, #unity-canvas { width: 100%; height: 100%; margin: 0; }
        html, body { overflow: hidden; background: #1f319e; }
        #unity-canvas { display: block; background: #1f319e; touch-action: none; }
        #loading-cover { position: fixed; inset: 0; display: grid; place-items: center; color: white; background: #1f319e; font: 600 18px Arial, sans-serif; }
        #loading-content { width: min(320px, 75vw); text-align: center; }
        #progress { height: 8px; margin-top: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,.65); border-radius: 999px; }
        #progress-bar { width: 0; height: 100%; background: #fff; transition: width .12s linear; }
        #load-error { max-width: 80vw; color: #ffe6e6; white-space: pre-wrap; overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <div id="unity-container" tabindex="-1"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
    <div id="loading-cover" role="status" aria-live="polite">
        <div id="loading-content">
            <div id="loading-label">Loading Space Waves</div>
            <div id="progress"><div id="progress-bar"></div></div>
            <div id="load-error"></div>
        </div>
    </div>
    <script src="/games/Space%20Waves/space-waves-local.js" defer></script>
</body>
</html>
