<!doctype html>
<html lang="en">
<head>
<script>(() => {
    const assetRoot = window.location.hostname.toLowerCase() === "samurainumber1.github.io" ? "/yogurt/" : "/";
    document.write('<script src="' + assetRoot + 'assets/canonical-host.js"><' + '/script>');
})();</script>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10141a">
    <meta name="description" content="Launch Slow Roads, an endless driving game.">
    <meta http-equiv="refresh" content="0;url=/?localSlowRoads=1">
    <title>Slow Roads — Alex Mods</title>
    <style>
        :root { color-scheme: dark; font-family: "Segoe UI", system-ui, sans-serif; background: #10141a; color: #f3f5f8; }
        * { box-sizing: border-box; }
        body { min-width: 280px; min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 30%, #263b40, transparent 55%), #10141a; }
        main { width: min(460px, 100%); padding: 40px 32px; border: 1px solid #ffffff24; border-radius: 22px; background: #111820eF; box-shadow: 0 24px 80px #0008; text-align: center; }
        .mark { width: 58px; height: 58px; margin: 0 auto 22px; display: grid; place-items: center; border: 1px solid #ffffff55; border-radius: 50%; color: #f4f2ed; font-size: 30px; }
        p { margin: 0; color: #aab4be; font-size: 14px; line-height: 1.7; }
        h1 { margin: 0 0 12px; font-size: clamp(30px, 8vw, 42px); font-weight: 400; letter-spacing: .12em; }
        .launch { min-height: 50px; margin-top: 28px; padding: 0 27px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; border-radius: 99px; color: #17201f; background: #f4f2ed; font-size: 14px; font-weight: 650; text-decoration: none; transition: transform .18s ease, box-shadow .18s ease; }
        .launch:hover { transform: translateY(-2px); box-shadow: 0 8px 26px #f4f2ed35; }
        .launch:focus-visible { outline: 3px solid #f4f2ed; outline-offset: 4px; }
        .note { margin-top: 18px; font-size: 11px; }
        @media (prefers-reduced-motion: reduce) { .launch { transition: none; } }
    </style>
</head>
<body>
    <main>
        <div class="mark" aria-hidden="true">S</div>
        <h1>Slow Roads</h1>
        <p>Take a quiet drive through an endless open road. This local version runs from the game stash.</p>
        <a class="launch" href="/?localSlowRoads=1">Play Slow Roads <span aria-hidden="true">↗</span></a>
        <p class="note">Runs locally from this site.</p>
    </main>
</body>
</html>
