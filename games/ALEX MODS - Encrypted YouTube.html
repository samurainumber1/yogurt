<!doctype html>
<html lang="en">
<head>
    <script>(() => { const assetRoot = window.location.hostname.toLowerCase() === "samurainumber1.github.io" ? "/yogurt/" : "/"; document.write('<script src="' + assetRoot + 'assets/canonical-host.js"><' + '/script>'); })();</script>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d12">
    <title>ALEX MODS — YouTube</title>
    <style>
        :root{color-scheme:dark;--bg:#0b0d12;--panel:#12151d;--panel2:#191d27;--line:#262b36;--text:#f4f6fb;--muted:#9299aa;--cyan:#67efff;--purple:#9e83ff}
        *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}a{color:inherit;text-decoration:none}
        .topbar{height:68px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:28px;padding:0 clamp(16px,4vw,52px);background:rgba(11,13,18,.92);border-bottom:1px solid #ffffff0d;backdrop-filter:blur(18px)}
        .brand{display:flex;align-items:center;gap:11px;flex:none}.brand-mark{display:grid;place-items:center;width:37px;height:37px;border:1px solid #67efff77;border-radius:12px;color:var(--cyan);background:linear-gradient(145deg,#67efff24,#9e83ff16);font-weight:900;font-size:19px;box-shadow:0 0 25px #67efff12}.brand-name{font-size:12px;font-weight:850;letter-spacing:.14em}.brand-subtitle{display:block;color:#8e9ab0;font-size:9px;letter-spacing:.16em}
        .search-wrap{position:relative;width:min(600px,62vw);margin:auto;display:flex}.search-wrap input{width:100%;height:42px;padding:0 52px 0 17px;border:1px solid #ffffff19;border-radius:999px;background:#171a23;color:var(--text);outline:none}.search-wrap input:focus{border-color:#67efff88;box-shadow:0 0 0 3px #67efff15}.search-submit{position:absolute;right:4px;top:4px;width:36px;height:34px;border:0;border-radius:999px;background:#242a35;color:var(--cyan);font-size:17px}.suggestions{display:none;position:absolute;top:48px;left:0;right:0;padding:6px;background:#171a23;border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 50px #0009}.suggestions.show{display:block}.suggestions button{display:block;width:100%;padding:10px 12px;border:0;border-radius:9px;background:transparent;text-align:left;color:#dfe4ee}.suggestions button:hover{background:#ffffff0b}
        .shell{display:grid;grid-template-columns:218px minmax(0,1fr);max-width:1600px;margin:auto}.sidebar{position:sticky;top:68px;height:calc(100vh - 68px);padding:24px 14px;border-right:1px solid #ffffff0b}.nav-label{padding:4px 12px 12px;color:#667084;font-size:10px;font-weight:800;letter-spacing:.16em}.nav-btn{display:flex;align-items:center;gap:13px;width:100%;padding:12px;border:0;border-radius:11px;background:transparent;color:#aeb5c4;text-align:left}.nav-btn.active,.nav-btn:hover{background:#ffffff0b;color:white}.nav-btn.active{color:var(--cyan)}.nav-icon{width:19px;text-align:center;font-size:17px}.sidebar-note{position:absolute;bottom:24px;left:25px;right:25px;color:#6f788a;font-size:10px;line-height:1.65}
        main{min-width:0;padding:28px clamp(18px,3vw,42px) 60px}.hero{position:relative;overflow:hidden;display:flex;align-items:end;min-height:180px;margin-bottom:28px;padding:27px 32px;border:1px solid #ffffff12;border-radius:22px;background:radial-gradient(ellipse at 80% 10%,#986cff35,transparent 46%),radial-gradient(ellipse at 12% 100%,#50d9ee19,transparent 43%),linear-gradient(110deg,#171b28,#12151e)}.hero:after{content:"▶";position:absolute;right:8%;top:-60px;color:#ffffff08;font-size:260px;font-weight:900;line-height:1}.hero-content{position:relative;z-index:1}.eyebrow{color:var(--cyan);font-size:10px;font-weight:850;letter-spacing:.18em}.hero h1{margin:7px 0 4px;font-size:clamp(25px,4vw,38px);letter-spacing:-.045em}.hero p{margin:0;color:#aab2c1}.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 16px}.section-head h2{margin:0;font-size:18px;letter-spacing:-.02em}.section-head span{color:#778195;font-size:11px}
        .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:25px 17px}.card{min-width:0;cursor:pointer}.thumb{position:relative;overflow:hidden;aspect-ratio:16/9;border-radius:13px;background:linear-gradient(135deg,#202735,#10141d)}.thumb img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .25s}.card:hover .thumb img{transform:scale(1.035)}.play{position:absolute;inset:0;display:grid;place-items:center;background:#0000;transition:background .2s}.card:hover .play{background:#0003}.play b{display:grid;place-items:center;width:45px;height:45px;border-radius:50%;background:#0b0d12c9;color:white;opacity:0;transform:scale(.8);transition:.2s}.card:hover .play b{opacity:1;transform:scale(1)}.card-info{display:flex;gap:11px;padding-top:12px}.avatar{display:grid;place-items:center;flex:none;width:34px;height:34px;border:1px solid #67efff38;border-radius:50%;color:var(--cyan);background:#17212a;font-size:12px;font-weight:800}.card-title{display:-webkit-box;overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:13px;font-weight:700;line-height:1.4}.card-channel{margin-top:5px;color:#9199a9;font-size:11px}.meta{color:#70798a;font-size:10px}
        .watch{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:25px}.player-box{overflow:hidden;aspect-ratio:16/9;border-radius:16px;background:#000;box-shadow:0 20px 70px #0006}.player-box iframe{width:100%;height:100%;border:0}.watch h1{margin:16px 0 12px;font-size:21px;line-height:1.3}.channel-row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}.channel-row .channel-name{font-weight:750}.channel-row .published{color:var(--muted);font-size:11px}.description{margin-top:14px;padding:16px;border-radius:13px;background:var(--panel);white-space:pre-wrap;color:#c4cad5;font-size:12px;max-height:190px;overflow:auto}.side-title{margin:0 0 12px;font-size:15px}.related-list{display:grid;gap:14px}.related-list .card{display:grid;grid-template-columns:145px minmax(0,1fr);gap:10px}.related-list .thumb{border-radius:9px}.related-list .card-info{padding:0}.related-list .avatar{display:none}.related-list .card-title{font-size:11px}.related-list .card-channel{font-size:10px}.related-list .meta{font-size:9px}
        .message{padding:50px 18px;color:var(--muted);text-align:center}.message strong{display:block;margin-bottom:5px;color:#e5e9f2;font-size:16px}.spinner{width:24px;height:24px;margin:0 auto 12px;border:2px solid #ffffff20;border-top-color:var(--cyan);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.toast{min-height:20px;margin:0 0 15px;color:#ff9aa9;font-size:12px}.hidden{display:none!important}.footer-note{margin-top:40px;color:#687284;font-size:10px}
        .creator-link{display:block;max-width:100%;padding:0;border:0;background:none;color:#9299aa;text-align:left;font:inherit;font-size:11px;cursor:pointer}.creator-link:hover{color:var(--cyan)}.channel-banner{display:flex;align-items:center;gap:20px;margin-bottom:28px;padding:24px;border:1px solid #ffffff12;border-radius:20px;background:radial-gradient(ellipse at 85% 0,#9e83ff20,transparent 48%),var(--panel)}.channel-banner .avatar{width:86px;height:86px;font-size:25px}.channel-banner h1{margin:0 0 3px;font-size:26px}.channel-stats{color:var(--muted);font-size:12px}.channel-description{max-width:800px;margin:8px 0 0;color:#aeb5c4;font-size:12px;white-space:pre-wrap}.shorts-feed{height:calc(100vh - 170px);min-height:490px;overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y mandatory;scrollbar-width:thin;scrollbar-color:#343a47 transparent}.short-card{position:relative;display:grid;place-items:center;height:100%;min-height:490px;scroll-snap-align:start;scroll-snap-stop:always}.short-frame{position:relative;overflow:hidden;width:min(100%,420px);height:min(100%,740px);aspect-ratio:9/16;border-radius:20px;background:#050608;box-shadow:0 15px 60px #0009}.short-frame iframe{width:100%;height:100%;border:0}.short-placeholder{position:absolute;inset:0}.short-placeholder img{width:100%;height:100%;object-fit:cover;opacity:.4}.short-overlay{position:absolute;z-index:2;right:14px;bottom:18px;left:14px;display:flex;align-items:end;justify-content:space-between;gap:12px;pointer-events:none;text-shadow:0 2px 8px #000}.short-caption{min-width:0;padding:10px;border-radius:10px;background:linear-gradient(transparent,#0009);pointer-events:auto}.short-caption strong{display:block;margin-bottom:4px}.short-caption button{padding:0;border:0;background:none;color:white;font-weight:750;text-shadow:0 2px 8px #000}.short-actions{display:grid;gap:16px;flex:none;pointer-events:auto}.short-actions button{display:grid;place-items:center;width:44px;height:44px;border:1px solid #ffffff35;border-radius:50%;background:#111a;color:white;font-size:18px}.short-actions button:hover{background:#67efff;color:#07111c}.short-search{display:flex;gap:8px;margin:0 0 14px}.short-search input{width:min(100%,380px);height:38px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--text)}.channel-row[data-channel]{cursor:pointer}.channel-row[data-channel]:hover .channel-name{color:var(--cyan)}
        @media(max-width:1120px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.watch{grid-template-columns:minmax(0,1fr) 260px}.related-list .card{grid-template-columns:115px minmax(0,1fr)}}@media(max-width:800px){.shell{grid-template-columns:1fr}.sidebar{position:sticky;top:68px;z-index:4;height:auto;display:flex;gap:5px;padding:7px 12px;border-right:0;border-bottom:1px solid #ffffff0b;background:#0b0d12}.nav-label,.sidebar-note{display:none}.nav-btn{justify-content:center;width:auto;flex:1;padding:9px 4px;font-size:10px}.nav-icon{display:none}.watch{grid-template-columns:1fr}.related-list{grid-template-columns:repeat(2,minmax(0,1fr))}.related-list .card{grid-template-columns:1fr}.related-list .card-info{padding-top:5px}}@media(max-width:600px){.topbar{height:60px;gap:12px;padding:0 13px}.brand-mark{width:33px;height:33px}.brand-name{font-size:10px}.brand-subtitle{font-size:8px}.search-wrap{width:auto;flex:1}.search-wrap input{height:38px;padding-left:12px}.shell{display:block}.sidebar{top:60px}.nav-btn{font-size:9px}main{padding:18px 13px 40px}.hero{min-height:150px;padding:23px 20px}.hero:after{right:-6%;font-size:190px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 11px}.thumb{border-radius:10px}.card-info{gap:8px;padding-top:9px}.avatar{width:29px;height:29px}.card-title{font-size:11px}.card-channel{font-size:10px}.watch h1{font-size:18px}.related-list{gap:12px}.related-list .card-title{font-size:10px}.footer-note{margin-top:28px}}
    </style>
</head>
<body>
<header class="topbar">
    <a class="brand" href="#home" aria-label="ALEX MODS home"><span class="brand-mark">A</span><span><span class="brand-name">ALEX MODS</span><span class="brand-subtitle">VIDEO STASH</span></span></a>
    <form class="search-wrap" id="search-form" role="search"><input id="search" type="search" placeholder="Search videos" autocomplete="off" maxlength="100" aria-label="Search videos"><button class="search-submit" aria-label="Search">⌕</button><div class="suggestions" id="suggestions"></div></form>
</header>
<div class="shell">
    <aside class="sidebar" aria-label="Navigation"><div class="nav-label">DISCOVER</div><button class="nav-btn active" data-view="home"><span class="nav-icon">⌂</span>Home</button><button class="nav-btn" data-view="shorts"><span class="nav-icon">▣</span>Shorts</button><button class="nav-btn" data-view="trending"><span class="nav-icon">⌁</span>Trending</button><button class="nav-btn" data-view="history"><span class="nav-icon">◷</span>Recently watched</button><div class="sidebar-note">ALEX MODS VIDEO STASH<br>Find something worth watching.</div></aside>
    <main><div class="toast" id="toast" role="status" aria-live="polite"></div><section id="content"></section><p class="footer-note">Catalog data is served through ALEX MODS. Playback uses YouTube’s official privacy-enhanced embed and connects directly to YouTube.</p></main>
</div>
<script>
(() => {
    const content = document.querySelector('#content'), form = document.querySelector('#search-form'), input = document.querySelector('#search');
    const toast = document.querySelector('#toast'), suggestions = document.querySelector('#suggestions');
    let suggestionTimer;
    const api = async path => { const response = await fetch(path, {headers:{Accept:'application/json'}}); const data = response.headers.get('content-type')?.includes('application/json') ? await response.json() : {}; if(!response.ok) throw new Error(data.error || 'Something went wrong. Try again.'); return data; };
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const thumb = id => `/api/youtube/thumbnail/${encodeURIComponent(id)}`;
    const relativeDate = date => { if(!date)return ''; const days=Math.floor((Date.now()-new Date(date).getTime())/86400000); return days<1?'today':days<30?`${days}d ago`:days<365?`${Math.floor(days/30)}mo ago`:`${Math.floor(days/365)}y ago`; };
    function showLoading(label='Finding videos…'){content.innerHTML=`<div class="message"><div class="spinner"></div>${esc(label)}</div>`;}
    function card(video){const id=esc(video.id),channelId=video.channelId||'';return `<article class="card" data-video="${id}" tabindex="0" role="link" aria-label="Watch ${esc(video.title)}"><div class="thumb"><img loading="lazy" src="${thumb(id)}" alt="" onerror="this.style.opacity='.15'"><span class="play"><b>▶</b></span></div><div class="card-info"><span class="avatar">${esc((video.channel||'A').slice(0,1).toUpperCase())}</span><div><div class="card-title">${esc(video.title)}</div>${channelId?`<button class="creator-link" data-channel="${esc(channelId)}">${esc(video.channel)}</button>`:`<div class="card-channel">${esc(video.channel)}</div>`}<div class="meta">${esc(relativeDate(video.publishedAt))}</div></div></div></article>`;}
    function bindCards(){content.querySelectorAll('[data-channel]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation();navigate({channel:el.dataset.channel});}));content.querySelectorAll('[data-video]').forEach(el=>{const go=()=>navigate({video:el.dataset.video});el.addEventListener('click',e=>{if(!e.target.closest('[data-channel]'))go();});el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}});});}
    async function home(view='home'){document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===view));showLoading('Loading the video shelf…');try{const query=view==='trending'?'popular music trailers':view==='history'?'': 'trending videos';let items=[];if(view==='history'){const ids=JSON.parse(localStorage.getItem('alexYoutubeHistory')||'[]');for(const id of ids.slice(0,12)){try{const v=await api(`/api/youtube/video/${id}`);items.push(v);}catch{}}}else{items=(await api(`/api/youtube/search?q=${encodeURIComponent(query)}&limit=24`)).items;}content.innerHTML=`<section class="hero"><div class="hero-content"><div class="eyebrow">ALEX MODS • VIDEO STASH</div><h1>${view==='trending'?'What’s trending':view==='history'?'Pick up where you left off':'A little something to watch'}</h1><p>Discover videos from across YouTube, all in one place.</p></div></section><div class="section-head"><h2>${view==='history'?'Recently watched':view==='trending'?'Trending now':'Recommended for you'}</h2><span>${items.length} videos</span></div>${items.length?`<div class="grid">${items.map(card).join('')}</div>`:'<div class="message"><strong>Your watch history is empty</strong>Play a video and it will appear here.</div>'}`;bindCards();}catch(error){content.innerHTML=`<div class="message"><strong>Can’t load videos</strong>${esc(error.message)}<br><br>Make sure the server has a YouTube Data API key configured.</div>`;}}
    async function search(query){query=query.trim();if(query.length<2)return;showLoading('Searching YouTube…');try{const items=(await api(`/api/youtube/search?q=${encodeURIComponent(query)}&limit=24`)).items;content.innerHTML=`<div class="section-head"><h2>Results for “${esc(query)}”</h2><span>${items.length} videos</span></div>${items.length?`<div class="grid">${items.map(card).join('')}</div>`:'<div class="message"><strong>No videos found</strong>Try another search.</div>'}`;bindCards();}catch(error){content.innerHTML=`<div class="message"><strong>Search didn’t work</strong>${esc(error.message)}</div>`;}}
    async function shorts(query=''){showLoading('Finding Shorts…');try{const items=(await api(`/api/youtube/shorts?q=${encodeURIComponent(query)}&limit=20`)).items;if(!items.length){content.innerHTML='<div class="message"><strong>No Shorts found</strong>Try a different topic.</div>';return;}content.innerHTML=`<div class="section-head"><h2>Shorts</h2><span>Scroll to keep watching</span></div><form class="short-search" id="short-search"><input name="q" value="${esc(query)}" placeholder="Find Shorts by topic" maxlength="100"><button class="search-submit" style="position:static;width:72px;height:38px;border-radius:999px">Search</button></form><div class="shorts-feed" id="shorts-feed">${items.map((v,i)=>`<section class="short-card" data-short="${esc(v.id)}"><div class="short-frame"><div class="short-placeholder"><img src="${thumb(esc(v.id))}" alt="" loading="lazy"></div></div><div class="short-overlay"><div class="short-caption"><strong>${esc(v.title)}</strong>${v.channelId?`<button data-channel="${esc(v.channelId)}">@ ${esc(v.channel)}</button>`:`<span>${esc(v.channel)}</span>`}</div><div class="short-actions"><button aria-label="Open channel" data-channel="${esc(v.channelId||'')}" ${v.channelId?'':'disabled'}>◉</button><button aria-label="Watch this video" data-open-video="${esc(v.id)}">▶</button></div></div></section>`).join('')}</div>`;const feed=document.querySelector('#shorts-feed');document.querySelector('#short-search').addEventListener('submit',e=>{e.preventDefault();navigate({shorts:e.currentTarget.elements.q.value.trim()});});feed.querySelectorAll('[data-channel]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.channel)navigate({channel:b.dataset.channel});}));feed.querySelectorAll('[data-open-video]').forEach(b=>b.addEventListener('click',()=>navigate({video:b.dataset.openVideo})));const observer=new IntersectionObserver(entries=>entries.forEach(entry=>{const section=entry.target,frame=section.querySelector('.short-frame');if(entry.isIntersecting){if(!frame.querySelector('iframe'))frame.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(section.dataset.short)}?autoplay=1&mute=1&controls=1&loop=1&playlist=${encodeURIComponent(section.dataset.short)}&playsinline=1" title="YouTube Short" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;}else{const player=frame.querySelector('iframe');if(player)player.remove();}}),{root:feed,threshold:.72});feed.querySelectorAll('.short-card').forEach(item=>observer.observe(item));}catch(error){content.innerHTML=`<div class="message"><strong>Shorts didn’t load</strong>${esc(error.message)}</div>`;}}
    async function channel(id){showLoading('Loading creator…');try{const data=await api(`/api/youtube/channel/${encodeURIComponent(id)}`);content.innerHTML=`<header class="channel-banner"><img class="avatar" src="${esc(data.avatar)}" alt="${esc(data.title)} channel icon" onerror="this.style.visibility='hidden'"><div><div class="eyebrow">CREATOR CHANNEL</div><h1>${esc(data.title)}</h1><div class="channel-stats">${data.subscriberCount?`${Number(data.subscriberCount).toLocaleString()} subscribers · `:''}${Number(data.videoCount||data.items.length).toLocaleString()} videos</div><p class="channel-description">${esc(data.description||'')}</p></div></header><div class="section-head"><h2>Latest videos</h2><span>${data.items.length} videos</span></div>${data.items.length?`<div class="grid">${data.items.map(card).join('')}</div>`:'<div class="message">No public videos are available.</div>'}`;bindCards();}catch(error){content.innerHTML=`<div class="message"><strong>Creator page unavailable</strong>${esc(error.message)}</div>`;}}
    async function watch(id){showLoading('Opening video…');try{const video=await api(`/api/youtube/video/${encodeURIComponent(id)}`);if(!video.embeddable)throw new Error('The owner of this video has disabled embedding.');const recent=JSON.parse(localStorage.getItem('alexYoutubeHistory')||'[]').filter(x=>x!==id);localStorage.setItem('alexYoutubeHistory',JSON.stringify([id,...recent].slice(0,20)));const related=(await api(`/api/youtube/search?q=${encodeURIComponent(video.channel)}&limit=8`)).items.filter(v=>v.id!==id);content.innerHTML=`<div class="watch"><article><div class="player-box"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?rel=0" title="${esc(video.title)}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture;web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div><h1>${esc(video.title)}</h1><div class="channel-row" ${video.channelId?`data-channel="${esc(video.channelId)}"`:''}>${video.channelId?`<img class="avatar" src="/api/youtube/channel/${encodeURIComponent(video.channelId)}/avatar" alt="${esc(video.channel)} channel icon">`:`<span class="avatar">${esc((video.channel||'A').slice(0,1).toUpperCase())}</span>`}<div><div class="channel-name">${esc(video.channel)}</div><div class="published">${esc(video.viewCount?Number(video.viewCount).toLocaleString()+' views':'')} ${video.publishedAt?' · '+esc(relativeDate(video.publishedAt)):''}</div></div></div><div class="description">${esc(video.description||'No description available.')}</div></article><aside><h2 class="side-title">Up next</h2><div class="related-list">${related.map(card).join('')}</div></aside></div>`;bindCards();}catch(error){content.innerHTML=`<div class="message"><strong>Video unavailable</strong>${esc(error.message)}<br><br><button class="nav-btn" id="back-home">← Back to videos</button></div>`;document.querySelector('#back-home')?.addEventListener('click',()=>navigate({view:'home'}));}}
    function navigate(state){const url=new URL(location.href);url.hash=state.video?`video=${encodeURIComponent(state.video)}`:state.query?`search=${encodeURIComponent(state.query)}`:state.channel?`channel=${encodeURIComponent(state.channel)}`:state.shorts!==undefined?`shorts=${encodeURIComponent(state.shorts)}`:`view=${encodeURIComponent(state.view||'home')}`;history.pushState(state,'',url);render(state);}
    function render(state){toast.textContent='';if(state.video)watch(state.video);else if(state.channel)channel(state.channel);else if(state.shorts!==undefined)shorts(state.shorts);else if(state.query){input.value=state.query;search(state.query);}else{input.value='';if(state.view==='shorts')shorts('');else home(state.view||'home');}}
    form.addEventListener('submit',e=>{e.preventDefault();suggestions.classList.remove('show');navigate({query:input.value});});
    input.addEventListener('input',()=>{clearTimeout(suggestionTimer);const q=input.value.trim();if(q.length<2){suggestions.classList.remove('show');return;}suggestionTimer=setTimeout(async()=>{try{const items=(await api(`/api/youtube/suggestions?q=${encodeURIComponent(q)}`)).items;if(q!==input.value.trim())return;suggestions.innerHTML=items.map(x=>`<button type="button">⌕ &nbsp;${esc(x)}</button>`).join('');suggestions.classList.toggle('show',items.length>0);suggestions.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{input.value=b.textContent.trim().replace(/^⌕\s*/, '');suggestions.classList.remove('show');navigate({query:input.value});}));}catch{suggestions.classList.remove('show');}},220);});
    document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))suggestions.classList.remove('show');});
    document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>b.dataset.view==='shorts'?navigate({shorts:''}):navigate({view:b.dataset.view})));
    window.addEventListener('popstate',e=>{if(e.state)render(e.state);else location.reload();});
    const initial=new URLSearchParams(location.hash.slice(1));const state=initial.has('video')?{video:initial.get('video')}:initial.has('search')?{query:initial.get('search')}:initial.has('channel')?{channel:initial.get('channel')}:initial.has('shorts')?{shorts:initial.get('shorts')}:{view:initial.get('view')||'home'};history.replaceState(state,'',location.href);render(state);
})();
</script>
</body>
</html>
