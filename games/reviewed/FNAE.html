<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FNAE</title>
<script>
(async () => {
  try {
    const files = ['FNAE.chunk01', 'FNAE.chunk02', 'FNAE.chunk03', 'FNAE.chunk04', 'FNAE.chunk05'];
    const pieces = [];
    let total = 0;
    for (const file of files) {
      const response = await fetch(file, { cache: 'force-cache' });
      if (!response.ok) throw new Error(`Could not load ${file} (${response.status})`);
      const bytes = new Uint8Array(await response.arrayBuffer());
      pieces.push(bytes);
      total += bytes.length;
    }
    const source = new Uint8Array(total);
    let offset = 0;
    for (const piece of pieces) {
      source.set(piece, offset);
      offset += piece.length;
    }
    const gameHtml = new TextDecoder('utf-8').decode(source);
    document.open();
    document.write(gameHtml);
    document.close();
  } catch (error) {
    document.body.innerHTML = '<main style="margin:10vh auto;max-width:640px;padding:24px;color:white;font:16px system-ui;background:#171923;border-radius:16px"><h1>FNAE could not load</h1><p></p></main>';
    document.querySelector('main p').textContent = error.message;
  }
})();
</script>
</head>
<body style="margin:0;background:#080a12;color:white;font:16px system-ui;display:grid;min-height:100vh;place-items:center">
<p>Loading FNAE locally?</p>
</body>
</html>
