<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Nova Discord 2.0</title>

<style>
:root{
    --bg:#070910;
    --bg2:#0c1020;
    --panel:#101529;
    --panel2:#151b31;
    --panel3:#1b2240;
    --border:#2b3455;
    --text:#f0f3ff;
    --muted:#8993b5;
    --accent:#785cff;
    --accent2:#b64cff;
    --cyan:#26d9ff;
    --green:#38e58a;
    --red:#ff5574;
    --yellow:#ffd166;
}

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    color:var(--text);

    background:
        radial-gradient(
            circle at 75% 0%,
            #5425a944,
            transparent 35%
        ),
        radial-gradient(
            circle at 0% 100%,
            #008ba633,
            transparent 35%
        ),
        var(--bg);

    overflow:hidden;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
    border:0;
    color:inherit;
}

.app{
    height:100vh;
    display:grid;
    grid-template-columns:
        72px
        250px
        minmax(0,1fr)
        260px;
}


/* SERVER BAR */

.serverbar{
    background:#080a12;
    border-right:1px solid var(--border);

    display:flex;
    flex-direction:column;
    align-items:center;

    padding:12px 9px;

    gap:9px;

    overflow:auto;
}

.server{
    width:52px;
    height:52px;

    border-radius:17px;

    background:#171d34;

    display:flex;
    justify-content:center;
    align-items:center;

    font-weight:900;

    transition:.18s;

    flex:none;
}

.server:hover{
    transform:translateY(-2px);
    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    box-shadow:
        0 10px 35px
        #765cff66;
}

.server.active{
    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );
}

.server-create{
    color:var(--green);
    font-size:25px;
}

.server-divider{
    width:35px;
    height:1px;
    background:var(--border);
}


/* SIDEBAR */

.sidebar{
    background:#0b0e18;
    border-right:1px solid var(--border);

    display:flex;
    flex-direction:column;

    padding:15px;

    min-width:0;
}

.brand{
    display:flex;
    align-items:center;

    gap:10px;

    font-weight:900;
    font-size:19px;

    margin-bottom:16px;
}

.logo{
    width:32px;
    height:32px;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            var(--cyan),
            var(--accent),
            #ff4fd8
        );

    box-shadow:
        0 0 30px
        #765cff77;
}

.search{
    width:100%;

    background:#070914;

    border:1px solid var(--border);

    color:white;

    padding:11px;

    border-radius:11px;

    outline:none;
}

.search:focus{
    border-color:var(--accent);

    box-shadow:
        0 0 0 3px
        #765cff22;
}

.section{
    color:#66708e;

    font-size:10px;

    font-weight:900;

    letter-spacing:1.3px;

    margin:
        18px
        6px
        7px;
}

.channel{
    width:100%;

    display:flex;
    align-items:center;

    gap:9px;

    padding:10px;

    border-radius:9px;

    color:var(--muted);

    background:transparent;

    text-align:left;

    margin:2px 0;
}

.channel:hover,
.channel.active{
    color:white;
    background:#191f37;
}

.channel .hash{
    color:#59647f;
    font-size:19px;
}

.channel.active .hash{
    color:var(--accent);
}

.dm-empty{
    color:#66708e;
    font-size:12px;
    padding:8px;
}

.profile{
    margin-top:auto;

    display:flex;
    align-items:center;

    gap:9px;

    padding:9px;

    background:#141a2e;

    border:1px solid var(--border);

    border-radius:13px;
}

.profile-name{
    font-size:12px;
    font-weight:900;
}

.profile-role{
    display:block;

    font-size:10px;

    color:var(--muted);
}

.logout{
    margin-left:auto;

    background:transparent;

    color:var(--muted);

    font-size:17px;
}


/* AVATARS */

.avatar{
    width:37px;
    height:37px;

    border-radius:50%;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        linear-gradient(
            135deg,
            #ff8b67,
            var(--accent)
        );

    font-size:11px;

    font-weight:900;

    position:relative;

    flex:none;
}

.online-dot{
    position:absolute;

    width:10px;
    height:10px;

    right:-1px;
    bottom:0;

    border-radius:50%;

    background:var(--green);

    border:2px solid #141a2e;
}


/* MAIN */

.main{
    min-width:0;

    display:flex;
    flex-direction:column;

    background:#0a0e1add;

    backdrop-filter:blur(15px);
}

.topbar{
    height:65px;

    border-bottom:1px solid var(--border);

    display:flex;
    align-items:center;

    padding:
        0
        18px;

    gap:10px;
}

.top-hash{
    color:#65708d;
    font-size:21px;
}

.room-name{
    font-weight:900;
}

.room-topic{
    border-left:1px solid var(--border);

    padding-left:12px;

    color:var(--muted);

    font-size:12px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.top-actions{
    margin-left:auto;

    display:flex;

    gap:4px;
}

.top-button{
    width:37px;
    height:37px;

    background:transparent;

    color:var(--muted);

    border-radius:9px;
}

.top-button:hover{
    color:white;
    background:#1a2038;
}


/* CHAT */

.chat{
    flex:1;

    overflow-y:auto;

    padding:
        22px
        28px;
}

.welcome{
    border:1px solid var(--border);

    background:
        linear-gradient(
            135deg,
            #191e3aaa,
            #0f1425
        );

    border-radius:19px;

    padding:21px;

    margin-bottom:20px;

    box-shadow:
        0 20px 70px
        #0005;
}

.welcome h1{
    margin:0 0 6px;

    font-size:23px;
}

.welcome p{
    margin:0;

    color:var(--muted);

    font-size:12px;
}

.message{
    display:flex;

    gap:12px;

    padding:8px;

    border-radius:10px;
}

.message:hover{
    background:#ffffff04;
}

.message-body{
    min-width:0;
}

.message-meta{
    display:flex;

    align-items:center;

    gap:7px;
}

.message-name{
    font-weight:900;
}

.message-time{
    color:#606a88;
    font-size:10px;
}

.role-badge{
    padding:
        2px
        6px;

    border-radius:5px;

    background:#252d4d;

    color:#b9c3e0;

    font-size:9px;
}

.verified-badge{
    color:#5ebaff;
}

.message-text{
    margin-top:4px;

    color:#cbd2e6;

    line-height:1.55;

    white-space:pre-wrap;

    word-break:break-word;
}


/* COMPOSER */

.composer-wrap{
    padding:
        10px
        22px
        19px;
}

.composer{
    display:flex;

    align-items:center;

    gap:10px;

    padding:9px;

    background:#12182c;

    border:1px solid var(--border);

    border-radius:14px;

    box-shadow:
        0 15px 45px
        #0005;
}

.composer input{
    flex:1;

    min-width:0;

    color:white;

    background:transparent;

    border:0;

    outline:0;
}

.send{
    width:40px;
    height:38px;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    font-weight:900;
}


/* MEMBERS */

.members{
    background:#0b0e18;

    border-left:1px solid var(--border);

    padding:18px 13px;

    overflow-y:auto;
}

.members-title{
    color:#68728e;

    font-size:10px;

    letter-spacing:1px;

    font-weight:900;

    margin:
        3px
        7px
        11px;
}

.member{
    display:flex;

    align-items:center;

    gap:9px;

    padding:8px;

    border-radius:9px;

    cursor:pointer;
}

.member:hover{
    background:#171d34;
}

.member-name{
    font-size:12px;
    font-weight:900;
}

.member-role{
    display:block;

    font-size:10px;

    color:var(--muted);
}


/* MODAL */

.modal{
    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;
    justify-content:center;

    background:#000b;

    backdrop-filter:blur(8px);

    padding:20px;
}

.modal.open{
    display:flex;
}

.modal-box{
    width:
        min(
            620px,
            95vw
        );

    max-height:90vh;

    overflow:auto;

    background:#10162a;

    border:1px solid #30395e;

    border-radius:18px;

    padding:21px;

    box-shadow:
        0 30px 100px
        #000d;
}

.modal-title{
    margin:
        0
        0
        16px;

    font-size:20px;
}

.field{
    width:100%;

    padding:11px;

    margin:
        4px
        0
        9px;

    border-radius:10px;

    border:1px solid var(--border);

    background:#080c18;

    color:white;

    outline:none;
}

.primary{
    padding:
        10px
        15px;

    border-radius:9px;

    background:
        linear-gradient(
            135deg,
            var(--accent),
            var(--accent2)
        );

    font-weight:900;
}

.secondary{
    padding:
        10px
        15px;

    border-radius:9px;

    background:#1b223b;

    margin-left:7px;
}

.admin-row{
    display:flex;

    align-items:center;

    gap:10px;

    padding:10px;

    margin:7px 0;

    border-radius:10px;

    background:#151c32;

    border:1px solid var(--border);
}

.admin-row select{
    margin-left:auto;

    padding:7px;

    background:#080c18;

    color:white;

    border:1px solid var(--border);

    border-radius:8px;
}


/* TOAST */

.toast{
    position:fixed;

    z-index:200;

    right:22px;
    bottom:22px;

    padding:
        11px
        15px;

    border-radius:10px;

    background:#171e35;

    border:1px solid #354064;

    box-shadow:
        0 20px 50px
        #0008;

    opacity:0;

    transform:translateY(12px);

    transition:.2s;

    pointer-events:none;
}

.toast.show{
    opacity:1;
    transform:none;
}


/* MOBILE */

@media(max-width:1000px){

    .app{
        grid-template-columns:
            65px
            220px
            minmax(0,1fr);
    }

    .members{
        display:none;
    }
}

@media(max-width:650px){

    .app{
        grid-template-columns:
            58px
            minmax(0,1fr);
    }

    .sidebar{
        display:none;
    }

    .chat{
        padding:14px;
    }

    .room-topic{
        display:none;
    }

    .composer-wrap{
        padding:9px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- SERVER BAR -->

    <aside class="serverbar">

        <button
            class="server active"
            id="homeServer"
            onclick="selectServer('home')"
        >
            N
        </button>

        <div id="serverList"></div>

        <div class="server-divider"></div>

        <button
            class="server server-create"
            onclick="openCreateServer()"
        >
            +
        </button>

    </aside>


    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="brand">
            <div class="logo"></div>
            Nova
        </div>


        <input
            id="search"
            class="search"
            placeholder="Search..."
        >


        <div class="section">
            TEXT CHANNELS
        </div>

        <div id="channelList"></div>


        <div class="section">
            DIRECT MESSAGES
        </div>

        <div id="dmList"></div>


        <div class="profile">

            <div class="avatar" id="profileAvatar">
                ?
                <span class="online-dot"></span>
            </div>

            <div>
                <div
                    class="profile-name"
                    id="profileName"
                >
                    Loading...
                </div>

                <span
                    class="profile-role"
                    id="profileRole"
                >
                    ...
                </span>
            </div>

            <button
                class="logout"
                onclick="logout()"
            >
                ↪
            </button>

        </div>

    </aside>


    <!-- MAIN -->

    <main class="main">

        <header class="topbar">

            <span class="top-hash">
                #
            </span>

            <span
                class="room-name"
                id="roomName"
            >
                general
            </span>

            <span
                class="room-topic"
                id="roomTopic"
            >
                Nova community
            </span>


            <div class="top-actions">

                <button
                    class="top-button"
                    onclick="refreshEverything()"
                >
                    ↻
                </button>

                <button
                    class="top-button"
                    onclick="toggleMembers()"
                >
                    👥
                </button>

                <button
                    class="top-button"
                    id="adminButton"
                    style="display:none"
                    onclick="openAdminPanel()"
                >
                    🛡
                </button>

            </div>

        </header>


        <section
            class="chat"
            id="chat"
        >

            <div class="welcome">

                <h1 id="welcomeTitle">
                    Welcome to Nova ✨
                </h1>

                <p id="welcomeText">
                    Pick a channel or DM
                    someone online.
                </p>

            </div>


            <div id="messages"></div>

        </section>


        <div class="composer-wrap">

            <form
                class="composer"
                id="messageForm"
            >

                <input
                    id="messageInput"
                    autocomplete="off"
                    placeholder="Message #general"
                >

                <button
                    class="send"
                    type="submit"
                >
                    ➤
                </button>

            </form>

        </div>

    </main>


    <!-- ONLINE USERS -->

    <aside class="members">

        <div class="members-title">
            ONLINE ACCOUNTS
        </div>

        <div id="onlineUsers"></div>

    </aside>

</div>


<!-- MODAL -->

<div
    class="modal"
    id="modal"
>

    <div
        class="modal-box"
        id="modalBox"
    ></div>

</div>


<!-- TOAST -->

<div
    class="toast"
    id="toast"
></div>


<script>

let me = null;

let currentServer = "home";

let currentChannel = "general";

let currentDM = null;

let heartbeatTimer = null;

let messageTimer = null;


/* ============================================================
   HELPERS
============================================================ */

const $ = id =>
    document.getElementById(id);


async function api(
    url,
    options = {}
){

    const response =
        await fetch(
            url,
            {
                credentials:"same-origin",

                headers:{
                    "Content-Type":
                        "application/json",

                    ...(options.headers || {})
                },

                ...options
            }
        );

    const data =
        await response
            .json()
            .catch(
                () => ({})
            );

    if(!response.ok){

        throw new Error(
            data.message ||
            "Request failed"
        );

    }

    return data;
}


function escapeHTML(value){

    return String(
        value ?? ""
    ).replace(
        /[&<>"']/g,
        character => ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
        }[character])
    );
}


function initials(
    username
){

    return String(
        username || "?"
    )
        .slice(0,2)
        .toUpperCase();
}


function showToast(
    message
){

    const toast =
        $("toast");

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            () => {
                toast.classList.remove(
                    "show"
                );
            },
            2200
        );
}


function openModal(
    html
){

    $("modalBox").innerHTML =
        html;

    $("modal").classList.add(
        "open"
    );
}


function closeModal(){

    $("modal").classList.remove(
        "open"
    );
}


/* ============================================================
   AUTH
============================================================ */

function openLogin(){

    openModal(`
        <h2 class="modal-title">
            Sign in to Nova
        </h2>

        <input
            id="loginUsername"
            class="field"
            placeholder="Username"
        >

        <input
            id="loginPassword"
            class="field"
            type="password"
            placeholder="Password"
        >

        <button
            class="primary"
            onclick="login()"
        >
            Sign in
        </button>

        <button
            class="secondary"
            onclick="openRegister()"
        >
            Create account
        </button>
    `);

}


function openRegister(){

    openModal(`
        <h2 class="modal-title">
            Create your Nova account
        </h2>

        <input
            id="registerUsername"
            class="field"
            placeholder="Username"
        >

        <input
            id="registerPassword"
            class="field"
            type="password"
            placeholder="Password"
        >

        <button
            class="primary"
            onclick="register()"
        >
            Create account
        </button>

        <button
            class="secondary"
            onclick="openLogin()"
        >
            Back
        </button>
    `);

}


async function login(){

    try{

        const result =
            await api(
                "/api/login",
                {
                    method:"POST",

                    body:JSON.stringify({
                        username:
                            $("loginUsername").value,

                        password:
                            $("loginPassword").value
                    })
                }
            );

        me =
            result.user;

        closeModal();

        updateProfile();

        await startup();

        showToast(
            "Welcome back ✨"
        );

    }catch(error){

        showToast(
            error.message
        );

    }

}


async function register(){

    try{

        const result =
            await api(
                "/api/register",
                {
                    method:"POST",

                    body:JSON.stringify({
                        username:
                            $("registerUsername").value,

                        password:
                            $("registerPassword").value
                    })
                }
            );

        me =
            result.user;

        closeModal();

        updateProfile();

        await startup();

        showToast(
            "Account created 🚀"
        );

    }catch(error){

        showToast(
            error.message
        );

    }

}


async function logout(){

    try{

        await api(
            "/api/logout",
            {
                method:"POST"
            }
        );

        location.reload();

    }catch(error){

        showToast(
            error.message
        );

    }

}


/* ============================================================
   PROFILE
============================================================ */

function updateProfile(){

    $("profileName").textContent =
        me.username;

    $("profileRole").textContent =
        me.role +
        (
            me.verified
                ? " • verified"
                : ""
        );

    $("profileAvatar").firstChild
        .textContent =
        initials(
            me.username
        );

    if(
        me.role === "admin"
    ){

        $("adminButton")
            .style.display =
            "block";

    }

}


/* ============================================================
   SERVERS
============================================================ */

async function loadServers(){

    const result =
        await api(
            "/api/discord/servers"
        );

    const servers =
        result.servers;

    $("serverList").innerHTML =
        servers
            .filter(
                server =>
                    server.id !== "home"
            )
            .map(
                server => `
                    <button
                        class="server"
                        title="${escapeHTML(server.name)}"
                        onclick="selectServer('${server.id}')"
                    >
                        ${escapeHTML(
                            initials(
                                server.name
                            )
                        )}
                    </button>
                `
            )
            .join("");

}


async function selectServer(
    serverID
){

    currentServer =
        serverID;

    currentDM =
        null;

    document
        .querySelectorAll(
            ".server"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    (
                        serverID ===
                        "home"
                        &&
                        button.id ===
                        "homeServer"
                    )
                );

            }
        );

    const result =
        await api(
            "/api/discord/servers/" +
            encodeURIComponent(
                serverID
            )
        );

    const server =
        result.server;

    $("roomTopic").textContent =
        (
            server.verified
                ? "✓ Verified server"
                : "Nova community server"
        );

    renderChannels(
        server.channels
    );

    if(
        server.channels.length
    ){

        currentChannel =
            server.channels[0].name;

        await loadMessages();

    }

}


function renderChannels(
    channels
){

    $("channelList").innerHTML =
        channels
            .map(
                channel => `
                    <button
                        class="channel"
                        onclick="selectChannel('${channel.id}','${escapeHTML(channel.name)}')"
                    >
                        <span class="hash">
                            #
                        </span>

                        ${escapeHTML(
                            channel.name
                        )}
                    </button>
                `
            )
            .join("");

}


async function selectChannel(
    channelID,
    channelName
){

    currentChannel =
        channelName;

    currentDM =
        null;

    $("roomName").textContent =
        channelName;

    $("roomTopic").textContent =
        "Nova community channel";

    $("messageInput").placeholder =
        "Message #" +
        channelName;

    document
        .querySelectorAll(
            "#channelList .channel"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.textContent
                        .trim()
                        .endsWith(
                            channelName
                        )
                );

            }
        );

    await loadMessages();

}


/* ============================================================
   CREATE SERVER
============================================================ */

function openCreateServer(){

    openModal(`
        <h2 class="modal-title">
            Create a server
        </h2>

        <input
            id="serverName"
            class="field"
            placeholder="Server name"
            maxlength="40"
        >

        <input
            id="channelName"
            class="field"
            placeholder="First channel"
            value="general"
        >

        <button
            class="primary"
            onclick="createServer()"
        >
            Create server
        </button>

        <button
            class="secondary"
            onclick="closeModal()"
        >
            Cancel
        </button>
    `);

}


async function createServer(){

    try{

        const result =
            await api(
                "/api/discord/servers",
                {
                    method:"POST",

                    body:JSON.stringify({
                        name:
                            $("serverName").value,

                        channel:
                            $("channelName").value
                    })
                }
            );

        closeModal();

        await loadServers();

        await selectServer(
            result.server.id
        );

        showToast(
            "Server created 🚀"
        );

    }catch(error){

        showToast(
            error.message
        );

    }

}


/* ============================================================
   MESSAGES
============================================================ */

async function loadMessages(){

    if(!me)
        return;

    try{

        let result;

        if(currentDM){

            result =
                await api(
                    "/api/discord/dm/" +
                    encodeURIComponent(
                        currentDM
                    )
                );

        }else{

            result =
                await api(
                    "/api/discord/messages?" +
                    new URLSearchParams({
                        server_id:
                            currentServer,

                        channel:
                            currentChannel
                    })
                );

        }

        renderMessages(
            result.messages
        );

    }catch(error){

        showToast(
            error.message
        );

    }

}


function renderMessages(
    messages
){

    $("messages").innerHTML =
        messages
            .map(
                message => {

                    const verified =
                        message.verified;

                    return `
                        <article class="message">

                            <div class="avatar">

                                ${escapeHTML(
                                    initials(
                                        message.from
                                    )
                                )}

                                <span class="online-dot"></span>

                            </div>

                            <div class="message-body">

                                <div class="message-meta">

                                    <span class="message-name">
                                        ${escapeHTML(
                                            message.from
                                        )}
                                    </span>

                                    ${
                                        verified
                                        ?
                                        `
                                            <span class="verified-badge">
                                                ✓
                                            </span>
                                        `
                                        :
                                        ""
                                    }

                                    <span class="role-badge">
                                        ${escapeHTML(
                                            message.role ||
                                            "user"
                                        )}
                                    </span>

                                    <span class="message-time">
                                        ${escapeHTML(
                                            message.created_at ||
                                            ""
                                        )}
                                    </span>

                                </div>

                                <div class="message-text">
                                    ${escapeHTML(
                                        message.text
                                    )}
                                </div>

                            </div>

                        </article>
                    `;

                }
            )
            .join("");

    $("chat").scrollTop =
        $("chat").scrollHeight;

}


$("messageForm").addEventListener(
    "submit",
    async event => {

        event.preventDefault();

        const text =
            $("messageInput")
                .value
                .trim();

        if(!text)
            return;

        try{

            if(currentDM){

                await api(
                    "/api/discord/dm",
                    {
                        method:"POST",

                        body:JSON.stringify({
                            to:
                                currentDM,

                            text
                        })
                    }
                );

            }else{

                await api(
                    "/api/discord/messages",
                    {
                        method:"POST",

                        body:JSON.stringify({
                            server_id:
                                currentServer,

                            channel:
                                currentChannel,

                            text
                        })
                    }
                );

            }

            $("messageInput").value =
                "";

            await loadMessages();

        }catch(error){

            showToast(
                error.message
            );

        }

    }
);


/* ============================================================
   ONLINE USERS / DMS
============================================================ */

async function loadOnline(){

    try{

        const result =
            await api(
                "/api/discord/online"
            );

        const users =
            result.users;

        $("onlineUsers").innerHTML =
            users
                .map(
                    user => `

                        <div
                            class="member"
                            onclick="openDM('${escapeHTML(user.username)}')"
                        >

                            <div class="avatar">

                                ${escapeHTML(
                                    initials(
                                        user.username
                                    )
                                )}

                                <span class="online-dot"></span>

                            </div>

                            <div>

                                <div class="member-name">

                                    ${escapeHTML(
                                        user.username
                                    )}

                                    ${
                                        user.verified
                                            ? " ✓"
                                            : ""
                                    }

                                </div>

                                <span class="member-role">
                                    ${escapeHTML(
                                        user.role
                                    )}
                                </span>

                            </div>

                        </div>

                    `
                )
                .join("")
                ||
                `
                    <div class="dm-empty">
                        No other accounts are online.
                    </div>
                `;


        renderDMs(
            users
        );

    }catch(error){

        console.log(
            error
        );

    }

}


function renderDMs(
    users
){

    const others =
        users.filter(
            user =>
                user.username !==
                me.username
        );

    $("dmList").innerHTML =
        others
            .map(
                user => `

                    <button
                        class="channel"
                        onclick="openDM('${escapeHTML(user.username)}')"
                    >

                        <span>
                            💬
                        </span>

                        ${escapeHTML(
                            user.username
                        )}

                        ${
                            user.verified
                                ? " ✓"
                                : ""
                        }

                    </button>

                `
            )
            .join("")
            ||
            `
                <div class="dm-empty">
                    No online accounts.
                </div>
            `;

}


async function openDM(
    username
){

    currentDM =
        username;

    $("roomName").textContent =
        username;

    $("roomTopic").textContent =
        "Direct message • online";

    $("messageInput").placeholder =
        "Message " +
        username;

    await loadMessages();

}


/* ============================================================
   ADMIN PANEL
============================================================ */

async function openAdminPanel(){

    openModal(`
        <h2 class="modal-title">
            🛡 Nova Admin Center
        </h2>

        <div id="adminContent">
            Loading...
        </div>
    `);

    await loadAdminData();

}


async function loadAdminData(){

    try{

        const [
            usersResult,
            serversResult
        ] = await Promise.all([
            api(
                "/api/admin/users"
            ),
            api(
                "/api/admin/servers"
            )
        ]);

        const users =
            usersResult.users;

        const servers =
            serversResult.servers;


        let html = `
            <h3>
                Accounts
            </h3>
        `;


        users.forEach(
            user => {

                html += `

                    <div class="admin-row">

                        <div>

                            <strong>
                                ${escapeHTML(
                                    user.username
                                )}
                            </strong>

                            ${
                                user.verified
                                    ? `
                                        <span
                                            class="verified-badge"
                                        >
                                            ✓
                                        </span>
                                    `
                                    : ""
                            }

                        </div>


                        <select
                            onchange="
                                changeRole(
                                    '${escapeHTML(user.username)}',
                                    this.value
                                )
                            "
                        >

                            <option
                                value="user"
                                ${
                                    user.role === "user"
                                        ? "selected"
                                        : ""
                                }
                            >
                                User
                            </option>

                            <option
                                value="verified"
                                ${
                                    user.role === "verified"
                                        ? "selected"
                                        : ""
                                }
                            >
                                Verified
                            </option>

                            <option
                                value="dev"
                                ${
                                    user.role === "dev"
                                        ? "selected"
                                        : ""
                                }
                            >
                                Developer
                            </option>

                            <option
                                value="admin"
                                ${
                                    user.role === "admin"
                                        ? "selected"
                                        : ""
                                }
                            >
                                Admin
                            </option>

                        </select>

                    </div>

                `;

            }
        );


        html += `
            <h3>
                Servers
            </h3>
        `;


        servers.forEach(
            server => {

                html += `

                    <div class="admin-row">

                        <div>

                            <strong>
                                ${escapeHTML(
                                    server.name
                                )}
                            </strong>

                            <br>

                            <small>
                                Owner:
                                ${escapeHTML(
                                    server.owner
                                )}
                            </small>

                        </div>

                        <button
                            class="primary"
                            onclick="
                                verifyServer(
                                    '${server.id}',
                                    ${!server.verified}
                                )
                            "
                        >

                            ${
                                server.verified
                                    ? "Unverify"
                                    : "Verify"
                            }

                        </button>

                    </div>

                `;

            }
        );


        html += `
            <br>

            <button
                class="secondary"
                onclick="closeModal()"
            >
                Close
            </button>
        `;


        $("adminContent").innerHTML =
            html;

    }catch(error){

        $("adminContent").textContent =
            error.message;

    }

}


async function changeRole(
    username,
    role
){

    try{

        await api(
            "/api/admin/users/role",
            {
                method:"POST",

                body:JSON.stringify({
                    username,
                    role
                })
            }
        );

        showToast(
            "Role updated ✓"
        );

        await loadAdminData();

    }catch(error){

        showToast(
            error.message
        );

    }

}


async function verifyServer(
    serverID,
    verified
){

    try{

        await api(
            "/api/admin/servers/verify",
            {
                method:"POST",

                body:JSON.stringify({
                    server_id:
                        serverID,

                    verified
                })
            }
        );

        showToast(
            verified
                ? "Server verified ✓"
                : "Server unverified"
        );

        await loadAdminData();

        await loadServers();

    }catch(error){

        showToast(
            error.message
        );

    }

}


/* ============================================================
   UI
============================================================ */

function toggleMembers(){

    const members =
        document.querySelector(
            ".members"
        );

    if(
        members.style.display ===
        "none"
    ){

        members.style.display =
            "block";

    }else{

        members.style.display =
            "none";

    }

}


async function refreshEverything(){

    await loadServers();

    await loadOnline();

    await loadMessages();

    showToast(
        "Everything refreshed ✨"
    );

}


$("search").addEventListener(
    "input",
    event => {

        const query =
            event.target.value
                .toLowerCase();

        document
            .querySelectorAll(
                ".channel"
            )
            .forEach(
                channel => {

                    channel.style.display =
                        channel.textContent
                            .toLowerCase()
                            .includes(
                                query
                            )
                            ? "flex"
                            : "none";

                }
            );

    }
);


/* ============================================================
   HEARTBEAT
============================================================ */

async function heartbeat(){

    try{

        const result =
            await api(
                "/api/client/heartbeat",
                {
                    method:"POST",

                    body:JSON.stringify({
                        page:"discord.html"
                    })
                }
            );

        if(
            result.disconnected
        ){

            showToast(
                result.message
            );

            setTimeout(
                () => location.reload(),
                1500
            );

        }

    }catch(error){

        console.log(
            error
        );

    }

}


/* ============================================================
   STARTUP
============================================================ */

async function startup(){

    await loadServers();

    await selectServer(
        "home"
    );

    await loadOnline();

    await loadMessages();

    clearInterval(
        heartbeatTimer
    );

    clearInterval(
        messageTimer
    );

    heartbeatTimer =
        setInterval(
            heartbeat,
            5000
        );

    /*
       Poll messages every 2 seconds.
       This gives you functional multi-user
       chat without requiring WebSockets.
    */

    messageTimer =
        setInterval(
            async () => {

                if(document.hidden)
                    return;

                await loadMessages();

                await loadOnline();

            },
            2000
        );

}


async function boot(){

    try{

        const result =
            await api(
                "/api/session"
            );

        if(
            !result.authenticated
        ){

            openLogin();

            return;

        }

        me =
            result.user;

        updateProfile();

        await startup();

    }catch(error){

        showToast(
            error.message
        );

    }

}


$("modal").addEventListener(
    "click",
    event => {

        if(
            event.target ===
            $("modal")
        ){

            closeModal();

        }

    }
);


boot();

</script>
